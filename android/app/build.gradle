plugins {
    id "com.android.application"
}

android {
    namespace "org.rustsync.android"
    compileSdk 34

    defaultConfig {
        applicationId "org.rustsync.android"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }

    signingConfigs {
        def releaseProperties = new Properties()
        def releasePropertiesFile = rootProject.file("keystore.properties")
        if (releasePropertiesFile.exists()) {
            releasePropertiesFile.withInputStream { releaseProperties.load(it) }
        }
        if (releaseProperties["storeFile"] != null) {
            create("release") {
                storeFile rootProject.file(releaseProperties["storeFile"])
                storePassword releaseProperties["storePassword"]
                keyAlias releaseProperties["keyAlias"]
                keyPassword releaseProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.findByName("release") ?: signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs.useLegacyPackaging true
    }
}
