[package]
name = "rustsync"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Linux file synchronization core with upstream discovery/key compatibility"
repository = "https://github.com/Reverse-Engineered-Android/rustsync"

[dependencies]
anyhow = "1.0"
argon2 = { version = "0.5", features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
filetime = "0.2"
flate2 = "1.1.4"
fs2 = "0.4"
hex = "0.4"
ipnet = "2.10"
openssl = { version = "0.10.81", features = ["vendored"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "1.0"
tiny-keccak = { version = "2.0", features = ["keccak"] }
tiny_http = "0.12"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
lto = true
strip = true
