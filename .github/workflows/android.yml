name: android

on:
  workflow_call:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package in the action default no longer
          # resolves with current cmdline-tools; only take platform-tools.
          packages: platform-tools
      - name: Install Android SDK and NDK
        env:
          NDK_VERSION: "29.0.14206865"
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Build bundled rustsync for Android
        run: ./scripts/build-android-native.sh
      - name: Build APKs
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Normalize APK names
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/rustsync-android-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist/rustsync-android-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rustsync-android-apk-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
      - name: Publish release APKs
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "rustsync $RELEASE_TAG" \
              --generate-notes --repo "$GITHUB_REPOSITORY" dist/*
          fi
